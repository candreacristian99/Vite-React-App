kind = "web"
previewPath = "/"
title = "Kandera"
description = "A blank Vite + React homepage for Kandera."
version = "1.0.0"
id = "artifacts/vite-react-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23041

[services.development]
run = "pnpm --filter @workspace/vite-react-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vite-react-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/vite-react-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23041"
BASE_PATH = "/"